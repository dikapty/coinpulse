<a class="card" href="{{BASE}}posts/{{STEM}}.html">
  <div class="thumb">{{IMAGE}}<span class="card-tag">{{TAG}}</span></div>
  <div class="card-body">
    <h2>{{TITLE}}</h2>
    <p>{{DESCRIPTION}}</p>
    <p class="card-meta"><time datetime="{{DATE}}">{{DATE}}</time> · {{READING_TIME}}</p>
  </div>
</a>
