<a class="featured" href="{{BASE}}posts/{{STEM}}.html">
  <div class="featured-img">{{IMAGE}}</div>
  <div class="featured-body">
    <span class="featured-label">Latest story</span>
    <h2>{{TITLE}}</h2>
    <p>{{DESCRIPTION}}</p>
    <p class="card-meta"><time datetime="{{DATE}}">{{DATE}}</time> · {{READING_TIME}} read</p>
  </div>
</a>
