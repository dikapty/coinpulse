name: CoinPulse Comments

# Readers comment through the existing Telegram bot (the site is static — no server,
# no database). This job polls the bot, moderates deterministically, stores comments in
# the repo and, when a new comment was approved (pipeline exits 10), rebuilds + redeploys
# so the comment becomes visible on the article page.

on:
  schedule:
    - cron: "*/20 * * * *"      # every 20 min -> a new comment shows up quickly
  workflow_dispatch: {}

permissions:
  contents: write     # commit comments + rebuilt state
  pages: write        # redeploy the site
  id-token: write

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      new: ${{ steps.poll.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll bot + moderate + store comments
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python3 scripts/pipeline.py comments
          code=$?
          set -e
          if [ "$code" = "10" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New approved comment(s) — will rebuild and redeploy."
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "No new comments (exit $code)."
          fi

      - name: Commit comments + state
        run: |
          git config user.name "coinpulse-bot"
          git config user.email "coinpulse-bot@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "comments: $(date -u +%F_%H:%M)"
            for i in 1 2 3; do
              if git push; then break; fi
              git pull --rebase origin main || git rebase --abort
            done
          else
            echo "Nothing to commit."
          fi

      - name: Rebuild site with comments
        if: steps.poll.outputs.new == 'true'
        run: python3 scripts/publisher.py --build-only

      - name: Upload site artifact
        if: steps.poll.outputs.new == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-comments:
    needs: comments
    if: needs.comments.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
