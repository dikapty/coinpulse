name: Channel info probe (temporary utility)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyyaml
      - name: getChat on channel + bot getMe
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, requests
          t = os.environ["TELEGRAM_BOT_TOKEN"]
          me = requests.get(f"https://api.telegram.org/bot{t}/getMe", timeout=20).json()
          print("BOT:", json.dumps(me.get("result", {}), ensure_ascii=False))
          chat = requests.get(f"https://api.telegram.org/bot{t}/getChat", params={"chat_id": "@coinpulsedailynews"}, timeout=20).json()
          r = chat.get("result", {})
          keep = {k: r.get(k) for k in ("id", "type", "title", "username", "linked_chat_id") if k in r}
          print("CHANNEL:", json.dumps(keep, ensure_ascii=False))
          print("DISCUSSION_GROUP_LINKED:", bool(r.get("linked_chat_id")))
          print("getChat_ok:", chat.get("ok"), chat.get("description", ""))
          PY
