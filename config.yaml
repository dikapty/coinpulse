site:
  name: CoinPulse
  tagline: Daily crypto & finance news, decoded.
  language: en
  url: https://dikapty.github.io/coinpulse/
  author: CoinPulse Editorial
  timezone: UTC
  social:
    telegram_channel: https://t.me/coinpulsedailynews
publishing:
  auto_purge_pending_days: 5
  mode: hybrid
  min_score: 7.0
  rampup:
    enabled: true
    launch_date: '2026-09-28'
    week_limits:
    - 2
    - 2
    - 4
    - 4
    - 8
    - 8
    - 8
llm:
  provider: gemini
  daily_budget: 18
  gemini:
    model: gemini-3.6-flash
    fallback_models:
    - gemini-3.5-flash
    - gemini-3.1-flash-lite
    - gemini-2.5-flash-lite
    - gemini-flash-latest
    api_key_env: GEMINI_API_KEY
  groq:
    model: llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
  temperature: 0.4
  max_tokens: 3000
sources:
- name: CoinDesk
  url: https://www.coindesk.com/arc/outboundfeeds/rss/
  category: crypto
- name: CoinTelegraph
  url: https://cointelegraph.com/rss
  category: crypto
- name: Decrypt
  url: https://decrypt.co/feed
  category: crypto
- name: The Block
  url: https://www.theblock.co/rss.xml
  category: crypto
- name: CryptoPotato
  url: https://cryptopotato.com/feed/
  category: crypto
- name: Bitcoin Magazine
  url: https://bitcoinmagazine.com/feed
  category: crypto
- name: CryptoSlate
  url: https://cryptoslate.com/feed/
  category: crypto
- name: Investing.com
  url: https://www.investing.com/rss/news.rss
  category: markets
- name: MarketWatch
  url: https://feeds.marketwatch.com/marketwatch/topstories/
  category: markets
- name: CNBC Finance
  url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664
  category: markets
- name: Yahoo Finance
  url: https://finance.yahoo.com/news/rssindex
  category: markets
- name: Finbold
  url: https://finbold.com/feed/
  category: crypto
keywords:
- bitcoin
- btc
- ethereum
- eth
- crypto
- blockchain
- stablecoin
- altcoin
- defi
- nft
- token
- solana
- xrp
- dogecoin
- regulation
- sec
- etf
- fed
- interest rate
- inflation
- stock market
- fintech
forbidden_topics:
- medical advice
- personal financial advice
- price predictions with guaranteed returns
- gambling
- adult content
- violence
- terrorism
- sanctions evasion
- pump and dump
affiliates:
  enabled: false
  programs:
  - name: Example Exchange
    match:
    - exchange
    - buy bitcoin
    - trading
    url: https://example.com/ref/YOURID
    label: Sponsored partner link
monetization:
  adsense_enabled: false
  adsense_client: ''
  ad_slot_top: ''
  ad_slot_inline: ''
  ad_slot_bottom: ''
  ad_slot_index: ''
  custom_html:
    head: ''
    ad_slot_top: ''
    ad_slot_inline: ''
    ad_slot_bottom: ''
    ad_slot_index: ''
  site_verification: guLGblCEMa7k3JV3fwATQ0VLjOoBjozmGaQ7LsKgUZU
  verifications: {}
  ads_txt_lines: []
notification:
  telegram:
    enabled: true
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
    channel_id_env: TELEGRAM_CHANNEL_ID
    channel_id: ''
    channel_posts_per_run: 3
    bot_username: myfirstrich_bot
comments:
  # Telegram comment poller is RETIRED: comments live on the site via the Worker API.
  enabled: false
  poll_rounds: 3
  poll_timeout: 10
  telegram_widget: false
  # owner decision: comments live ON the site only — never re-enable the TG widget
  telegram_widget_auto: false
  telegram_channel: coinpulsedailynews
  widget_limit: 5
  api_url: https://coinpulse-api.globalromil.workers.dev
smm:
  enabled: true
  daily_post_cap: 4
  articles_per_day: 3
  min_gap_minutes: 45
  market_snapshot: true
  poll_every_days: 2
  digest_weekday: 6
  utm: utm_source=telegram&utm_medium=channel
quality:
  min_words: 600
  max_words: 1200
  min_sources: 1
  uniqueness_threshold: 0.85
seo:
  meta_description_chars: 160
  ai_disclosure: true
